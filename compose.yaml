# Frontend and backend share this project's default network, so nginx reaches the
# API as http://backend:8080. The backend is not published at all.
#
# The frontend is published on the local network, because the Cloudflare Tunnels
# run on another machine and point here:
#   app tunnel (with an Access policy)      -> http://<this server>:8642
#   mucalendar.michaelbielen.be (no Access) -> http://<this server>:8643
# Anyone on the local network can reach both ports directly, without Access.
services:
  backend:
    build:
      context: .
      dockerfile: muc-backend/Dockerfile
    environment:
      ConnectionStrings__Muc: Data Source=/data/muc.db
      # Empty disables the AI fallback.
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
    volumes:
      - muc-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./muc-frontend
      args:
        VITE_CALENDAR_URL: ${CALENDAR_URL:-https://mucalendar.michaelbielen.be/calendar.ics}
    depends_on:
      - backend
    # Port 80 is the app, port 8081 serves only the calendar feed.
    # Set MUC_BIND=127.0.0.1 to keep both off the network.
    ports:
      - "${MUC_BIND:-0.0.0.0}:${MUC_PORT:-8642}:80"
      - "${MUC_BIND:-0.0.0.0}:${MUC_CALENDAR_PORT:-8643}:8081"
    restart: unless-stopped

volumes:
  muc-data:
