# The app. Reached through the Cloudflare Tunnel that has an Access policy.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A pasted message is at most 20 000 characters.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Fail fast when the backend is down instead of hanging for a minute.
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri /index.html;
    }
}

# The public calendar feed, and nothing else. Reached through the second,
# unprotected tunnel: the app and /api must not be reachable on this port.
server {
    listen 8081;

    location = /calendar.ics {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
    }

    # The bare hostname works as the calendar address too.
    location = / {
        proxy_pass http://backend:8080/calendar.ics;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
    }

    location / {
        return 404;
    }
}
